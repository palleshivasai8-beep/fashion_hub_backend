spring.application.name=FashionHub
server.port=${PORT:8081}

# Set database credentials with SPRING_DATASOURCE_USERNAME and SPRING_DATASOURCE_PASSWORD.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/fashionhub}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# Keep the existing entities and table structure; override this for stricter production validation.
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.open-in-view=true

# Set to the deployed frontend origin(s) in Render; local Vite is always allowed.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,https://*.vercel.app}
